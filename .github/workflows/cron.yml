name: Booking Status Update Cron Job

on:
  schedule:
    - cron: "*/5 * * * *" # Runs every 5 minutes

jobs:
  update-bookings:
    runs-on: ubuntu-latest
    steps:
      - name: Call Update Bookings API
        run: |
          curl -X GET ${{ secrets.VERCEL_URL }}/api/cron/update-bookings
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
